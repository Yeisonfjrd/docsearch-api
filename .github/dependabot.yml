version: 2
updates:

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Prisma 7 drops `url` from the schema and needs driver adapters; migrate on purpose, not via a bot
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        dependency-type: development
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
